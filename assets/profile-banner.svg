      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#111827" stroke-opacity=".15"/>
  <ellipse cx="600" cy="150" rx="390" ry="190" fill="url(#glow)"/>

