<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Unes Jami — AI Automation Engineer</title>
  <desc id="desc">Minimal charcoal banner with animated blue network particles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.52" stop-color="#111820"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30363d"/>
      <stop offset="0.5" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#30363d"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#2f81f7" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1200" height="270" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="268" rx="17" fill="none" stroke="url(#edge)" stroke-opacity=".72"/>
  <ellipse cx="600" cy="135" rx="390" ry="160" fill="url(#halo)"/>

  <g fill="none" stroke="#2f81f7" stroke-width="1" stroke-opacity=".2">
    <path d="M40 54L190 92L296 46L410 106"/>
    <path d="M790 62L904 112L1030 60L1162 98"/>
    <path d="M18 212L158 170L300 222L420 178"/>
    <path d="M784 206L930 164L1058 218L1186 174"/>
  </g>

  <g fill="#58a6ff">
    <circle r="3" opacity=".45">
      <animateMotion dur="8s" repeatCount="indefinite" path="M40 54L190 92L296 46L410 106"/>
      <animate attributeName="opacity" values=".2;.85;.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" opacity=".45">
      <animateMotion dur="10s" repeatCount="indefinite" path="M790 62L904 112L1030 60L1162 98"/>
      <animate attributeName="opacity" values=".15;.75;.15" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" opacity=".45">
      <animateMotion dur="9s" repeatCount="indefinite" path="M18 212L158 170L300 222L420 178"/>
      <animate attributeName="opacity" values=".2;.8;.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" opacity=".45">
      <animateMotion dur="11s" repeatCount="indefinite" path="M784 206L930 164L1058 218L1186 174"/>
      <animate attributeName="opacity" values=".15;.7;.15" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#2f81f7">
    <circle cx="190" cy="92" r="4"><animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="60" r="4"><animate attributeName="r" values="4;7;4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="222" r="4"><animate attributeName="r" values="3;6;3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="164" r="4"><animate attributeName="r" values="4;7;4" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(553 36)">
    <rect width="94" height="54" rx="14" fill="#161b22" stroke="#30363d"/>
    <circle cx="34" cy="25" r="5" fill="#58a6ff"/>
    <circle cx="60" cy="25" r="5" fill="#8b949e"/>
    <path d="M32 39h30M47 0v-10" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="600" y="135" text-anchor="middle" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700" letter-spacing="3">UNES JAMI</text>
  <text x="600" y="176" text-anchor="middle" fill="#58a6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="3">AI AUTOMATION ENGINEER</text>
  <text x="600" y="211" text-anchor="middle" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2.5">AI WORKFLOWS  •  TELEGRAM SYSTEMS  •  ROBOTICS</text>
  <rect x="480" y="236" width="240" height="2" rx="1" fill="#30363d"/>
  <rect x="548" y="236" width="104" height="2" rx="1" fill="#2f81f7">
    <animate attributeName="x" values="480;616;480" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>