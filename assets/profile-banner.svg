    <circle cx="126" cy="90" r="5"><animate attributeName="r" values="4;6.5;4" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="196" cy="82" r="3.5"/><circle cx="278" cy="58" r="4"/>
    <circle cx="354" cy="92" r="5"><animate attributeName="r" values="4;7;4" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="384" cy="152" r="3"/><circle cx="326" cy="207" r="4.5"/>
    <circle cx="220" cy="187" r="3.5"/><circle cx="102" cy="238" r="5"><animate attributeName="opacity" values=".3;1;.3" dur="5.4s" repeatCount="indefinite"/></circle>
    <circle cx="846" cy="72" r="4"/><circle cx="934" cy="66" r="3"/>
    <circle cx="1038" cy="77" r="5"><animate attributeName="r" values="4;7;4" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1122" cy="86" r="3.5"/><circle cx="1176" cy="124" r="4.5"/>
    <circle cx="1128" cy="174" r="3"/><circle cx="1080" cy="210" r="5"><animate attributeName="opacity" values=".3;1;.3" dur="4.9s" repeatCount="indefinite"/></circle>
