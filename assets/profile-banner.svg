<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Unes Jami — AI Automation Engineer</title>
  <desc id="desc">Minimal white banner with mirrored animated blue particle networks.</desc>
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".14"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
    <g id="network">
      <g fill="none" stroke="#111827" stroke-width="1.1" stroke-linecap="round" stroke-opacity=".24">
        <path d="M24 64 C82 26 118 108 178 84 S260 42 326 86 S396 154 344 190 S222 170 142 224 S70 254 26 268"/>
        <path d="M46 238 C112 190 162 230 226 210 S310 224 388 262"/>
      </g>
      <g fill="#0ea5e9">
        <circle cx="24" cy="64" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="4.2s" repeatCount="indefinite"/></circle>
        <circle cx="118" cy="91" r="4.5"><animate attributeName="r" values="3.5;6;3.5" dur="4.8s" repeatCount="indefinite"/></circle>
        <circle cx="178" cy="84" r="3"/>
        <circle cx="252" cy="59" r="4"/>
        <circle cx="326" cy="86" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="5.1s" repeatCount="indefinite"/></circle>
        <circle cx="382" cy="140" r="3"/>
        <circle cx="344" cy="190" r="4.5"/>
        <circle cx="258" cy="188" r="3"/>
        <circle cx="142" cy="224" r="5"><animate attributeName="r" values="4;6.5;4" dur="5.4s" repeatCount="indefinite"/></circle>
        <circle cx="70" cy="254" r="3"/>
        <circle cx="226" cy="210" r="3.5"/>
        <circle cx="388" cy="262" r="4"/>
      </g>
      <g fill="#38bdf8" filter="url(#soft)">
        <circle r="3"><animateMotion dur="10s" repeatCount="indefinite" path="M24 64 C82 26 118 108 178 84 S260 42 326 86 S396 154 344 190 S222 170 142 224 S70 254 26 268"/></circle>
        <circle r="2.5"><animateMotion dur="8.5s" repeatCount="indefinite" path="M46 238 C112 190 162 230 226 210 S310 224 388 262"/></circle>
      </g>
    </g>
  </defs>

  <rect width="1200" height="300" rx="18" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#111827" stroke-opacity=".12"/>
  <ellipse cx="600" cy="150" rx="370" ry="175" fill="url(#glow)"/>

  <use href="#network"/>
  <use href="#network" transform="translate(1200 0) scale(-1 1)"/>

  <g text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif">
    <text x="600" y="126" fill="#111827" font-size="53" font-weight="700">Unes Jami</text>
    <text x="600" y="174" fill="#0284c7" font-size="24" font-weight="600">AI Automation Engineer</text>
    <text x="600" y="215" fill="#4b5563" font-size="17">Building Intelligent Workflows &amp; AI-Powered Digital Solutions</text>
  </g>
</svg>