    <path d="M22 62 C90 18 126 120 196 82 S286 38 354 92 S402 174 326 207 S190 165 102 238"/>
    <path d="M846 72 C918 18 968 116 1038 77 S1128 64 1176 124 C1200 158 1132 176 1080 210 S966 180 884 240"/>
    <path d="M18 264 C94 210 150 248 220 224 S304 240 390 274"/>
    <path d="M810 270 C890 220 940 246 1010 222 S1106 230 1186 266"/>
  </g>

