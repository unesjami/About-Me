  <text x="600" y="165" text-anchor="middle" fill="url(#neon)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">AI AUTOMATION ENGINEER</text>
  <text x="600" y="211" text-anchor="middle" fill="#a5b4fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="3">INTELLIGENT WORKFLOWS • TELEGRAM SYSTEMS • ROBOTICS</text>
  <text x="600" y="260" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="14" letter-spacing="4">BUILD. AUTOMATE. EVOLVE.</text>
