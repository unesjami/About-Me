<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Unes Jami — AI Automation Engineer</title>
  <desc id="desc">Minimal white banner with animated blue particles and curved black connections.</desc>
  <defs>
